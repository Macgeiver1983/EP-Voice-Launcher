plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'de.europlast.epvoice'
    compileSdk 35
    defaultConfig { applicationId 'de.europlast.epvoice'; minSdk 29; targetSdk 35; versionCode 13; versionName '0.4.7-direct-voice'; manifestPlaceholders = [launcherLabel: 'EP Voice Launcher'] }
    buildTypes {
        qa {
            initWith release
            applicationIdSuffix '.v047test'
            versionNameSuffix '-signed'
            debuggable false
            manifestPlaceholders = [launcherLabel: 'EP Voice 0.4.7 Signaturtest']
        }
        debug {
            applicationIdSuffix '.v047directvoice'
            manifestPlaceholders = [launcherLabel: 'EP Voice Direktstart Test']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
}
