name: EP Voice assistant diagnostic APK
on:
  push:
    branches: [test/voice-interaction-service, fix/assistant-recognition-metadata, dev/wakeword-assistant-session]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build assistant diagnostic APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature and security-relevant manifest
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          "$BUILD_TOOLS/aapt" dump permissions "$APK"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E -A 10 'ChatGptVoiceAccessibilityService|BIND_ACCESSIBILITY_SERVICE|SYSTEM_ALERT_WINDOW' || true
      - name: Compare against last working code baseline
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$CURRENT_APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive f08930aae1984bbd128b9ad2552a725a0314f8b6 | tar -x -C "$RUNNER_TEMP/baseline"
          (cd "$RUNNER_TEMP/baseline" && gradle :app:assembleDebug --stacktrace)
          BASELINE_APK=$(find "$RUNNER_TEMP/baseline/app/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$BASELINE_APK"
          "$BUILD_TOOLS/aapt" dump permissions "$BASELINE_APK" | sort > "$RUNNER_TEMP/baseline-permissions.txt"
          "$BUILD_TOOLS/aapt" dump permissions "$CURRENT_APK" | sort > "$RUNNER_TEMP/current-permissions.txt"
          echo "=== Manifest permission differences (baseline -> current) ==="
          diff -u "$RUNNER_TEMP/baseline-permissions.txt" "$RUNNER_TEMP/current-permissions.txt" || test "$?" -eq 1
          echo "=== Accessibility registration in current APK ==="
          "$BUILD_TOOLS/aapt" dump xmltree "$CURRENT_APK" AndroidManifest.xml | grep -A 8 'ChatGptVoiceAccessibilityService' || true
          cp "$BASELINE_APK" "$RUNNER_TEMP/baseline-no-accessibility.apk"
          echo "=== Baseline APK signature ==="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$BASELINE_APK"
          echo "=== Current APK signature ==="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$CURRENT_APK"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ep-voice-assistant-diagnostic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload A-B baseline APK (without accessibility registration)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ep-voice-ab-A-baseline-no-accessibility
          path: ${{ runner.temp }}/baseline-no-accessibility.apk
          if-no-files-found: error
      - name: Upload A-B current APK (with accessibility registration)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ep-voice-ab-B-with-accessibility
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
