name: EP Voice V0.5.0 lockscreen verification
on:
  push:
    branches: [dev/v0.5.0-lockscreen-handoff, test/v0.5.2-no-accessibility]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check model assets
        run: python3 scripts/check_v043.py --skip-audio
      - name: Compile and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify signature and model assets
        run: |
          python3 scripts/download_and_verify_models.py --apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ep-voice-v052-install-diagnostic
          path: app/build/outputs/apk/debug/app-debug.apk
