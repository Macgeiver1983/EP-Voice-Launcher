name: EP Voice Diagnose – direkter APK-Download
on:
  push:
    branches:
      - dev/v0.4.7-playprotect-diagnose
    paths:
      - '.github/workflows/diagnose-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK bauen und prüfen
        run: |
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          python3 scripts/download_and_verify_models.py --apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/EP_Voice_V047_Diagnose_ohne_Accessibility.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Direkten Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.7-diagnose-ohne-accessibility release/*.apk release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "EP Voice V0.4.7 – Diagnose ohne Accessibility" \
            --notes "Nur Installationsdiagnose auf Samsung. Separate Paketkennung; ersetzt V0.4.6 nicht. Debug-signiert; keine endgültige Freigabe. Accessibility ist für diesen Test deaktiviert. Play-Protect-Prüfung nicht umgehen." \
            --prerelease
