name: EP Voice – Modellprüfung und Android-Build
on:
  workflow_dispatch:
  push:
    branches: [main, 'dev/**', 'test/extend-unlock-keyguard']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ep-voice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: V0.4.2-Assets und Dual-Wakeword-Quellcode prüfen
        run: python3 scripts/check_v043.py --skip-audio
      - name: Android-Build und Lint
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug 2>&1 | tee ci-build.log
      - name: Tatsächlich in der APK enthaltene Modelle prüfen
        run: |
          python3 scripts/download_and_verify_models.py --apk app/build/outputs/apk/debug/app-debug.apk
          if test -f app/src/main/assets/openwakeword/hey_ep.onnx; then
            echo 'Experimental Hey EP model bundled; acoustic quality tests must be performed on phone.'
          else
            echo 'V0.4.3 DEV ONLY: hey_ep.onnx missing, Jarvis fallback only.'
          fi
      - name: APK und Buildprotokoll bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep-voice-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            ci-build.log
            ci-apk-model-report.txt
          if-no-files-found: warn
  modelle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Modelle herunterladen und ONNX-Struktur prüfen
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check onnx==1.17.0 onnxruntime==1.17.3 numpy==1.26.4
          python scripts/download_and_verify_models.py 2>&1 | tee ci-model-download.log
          python scripts/check_v043.py --skip-audio --require-model
      - name: Modellprotokolle bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep-voice-modelle
          path: |
            ci-model-report.txt
            ci-model-download.log
          if-no-files-found: warn

  signed-test:
    defaults:
      run:
        shell: bash
    if: (github.ref == 'refs/heads/dev/v0.4.7-accessibility-voice' || github.ref == 'refs/heads/test/extend-unlock-keyguard') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signaturprüfungen vorbereiten
        run: mkdir -p evidence
      - name: Nicht debuggable Test-APK bauen
        run: gradle --no-daemon --stacktrace :app:assembleQa :app:lintQa
      - name: Mit dauerhaftem QA-Signaturschlüssel signieren
        env:
          EP_QA_KEYSTORE_BASE64: ${{ secrets.EP_QA_KEYSTORE_BASE64 }}
          EP_QA_KEY_PASSWORD: ${{ secrets.EP_QA_KEY_PASSWORD }}
          EP_QA_STORE_PASSWORD: ${{ secrets.EP_QA_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in EP_QA_KEYSTORE_BASE64 EP_QA_KEY_PASSWORD EP_QA_STORE_PASSWORD; do
            if test -z "${!name}"; then
              echo "::error::Required GitHub Actions secret $name is missing or empty"
              exit 1
            fi
          done
          key="$RUNNER_TEMP/ep-voice-qa.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$EP_QA_KEYSTORE_BASE64" | base64 --decode > "$key"
          test -s "$key"
          # Verify the PKCS12 store password and determine its actual alias without printing secrets.
          keytool -list -keystore "$key" -storetype PKCS12 -storepass:env EP_QA_STORE_PASSWORD > "$RUNNER_TEMP/qa-keystore-list.txt"
          alias_name="$(sed -n 's/^Alias name: //p' "$RUNNER_TEMP/qa-keystore-list.txt" | head -n 1)"
          if test -z "$alias_name"; then
            alias_name="$(awk -F, '/PrivateKeyEntry/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}' "$RUNNER_TEMP/qa-keystore-list.txt")"
          fi
          if test -z "$alias_name"; then
            echo "::error::No private-key alias found in QA keystore"
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/zipalign" -f -p 4 app/build/outputs/apk/qa/app-qa-unsigned.apk "$RUNNER_TEMP/ep-voice-aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-type PKCS12 --ks-key-alias "$alias_name" \
            --ks-pass env:EP_QA_STORE_PASSWORD --key-pass env:EP_QA_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out evidence/EP_Voice_Launcher_V047_Signed_Test.apk "$RUNNER_TEMP/ep-voice-aligned.apk"
      - name: Signatur, Zertifikat, Manifest und Offline-Modelle prüfen
        run: |
          tools="$ANDROID_HOME/build-tools/34.0.0"
          apk=evidence/EP_Voice_Launcher_V047_Signed_Test.apk
          "$tools/zipalign" -c -p 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs --Werr "$apk" | tee evidence/qa-signature.txt
          # Include both platform generations to check v2 and its v3 stripping protection.
          "$tools/apksigner" verify --verbose --Werr --min-sdk-version 27 --max-sdk-version 36 "$apk" | tee evidence/qa-signature-v2-v3.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' evidence/qa-signature-v2-v3.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' evidence/qa-signature.txt
          grep -F 'Number of signers: 1' evidence/qa-signature.txt
          "$tools/apksigner" verify --verbose --Werr --min-sdk-version 36 --max-sdk-version 36 "$apk" | tee evidence/qa-signature-api36.txt
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$analyzer" manifest print "$apk" > evidence/qa-manifest.xml
          # Release packaging can shorten resource paths. Read the actual APK resource table.
          "$tools/aapt2" dump resources "$apk" > "$RUNNER_TEMP/qa-resources.txt"
          accessibility_xml="$(awk '
            /^[[:space:]]*resource .* xml\/chatgpt_voice_accessibility([[:space:]]|$)/ { selected=1; next }
            selected && /^[[:space:]]*resource / { exit }
            selected && match($0, /res\/[^[:space:]]+\.xml/) { print substr($0, RSTART, RLENGTH); exit }
          ' "$RUNNER_TEMP/qa-resources.txt")"
          test -n "$accessibility_xml"
          "$analyzer" resources xml --file "/$accessibility_xml" "$apk" > evidence/qa-accessibility.xml
          python3 scripts/verify_v047_test_manifest.py evidence/qa-manifest.xml evidence/qa-accessibility.xml
          python3 scripts/download_and_verify_models.py --apk "$apk" | tee evidence/qa-models.txt
          sha256sum "$apk" | tee evidence/qa-apk-sha256.txt
      - name: Prüfprotokolle bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep-voice-v047-signing-evidence
          path: |
            evidence/*.txt
            evidence/*.xml
            app/build/reports/lint-results-qa.*
      - name: Verifizierte signierte Test-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ep-voice-v047-signed-test
          path: evidence/EP_Voice_Launcher_V047_Signed_Test.apk
          if-no-files-found: error
      - name: Diagnose-APK ohne Accessibility bauen
        run: gradle --no-daemon --stacktrace :app:assembleDiagnostic :app:lintDiagnostic
      - name: Diagnose-Manifest kontrollieren und APK signieren
        env:
          EP_QA_KEYSTORE_BASE64: ${{ secrets.EP_QA_KEYSTORE_BASE64 }}
          EP_QA_KEY_PASSWORD: ${{ secrets.EP_QA_KEY_PASSWORD }}
          EP_QA_STORE_PASSWORD: ${{ secrets.EP_QA_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/ep-voice-diagnostic.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$EP_QA_KEYSTORE_BASE64" | base64 --decode > "$key"
          keytool -list -keystore "$key" -storetype PKCS12 -storepass:env EP_QA_STORE_PASSWORD > "$RUNNER_TEMP/diagnostic-keystore.txt"
          alias_name="$(awk -F, '/PrivateKeyEntry/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}' "$RUNNER_TEMP/diagnostic-keystore.txt")"
          test -n "$alias_name"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          unsigned=app/build/outputs/apk/diagnostic/app-diagnostic-unsigned.apk
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/diagnostic-aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-type PKCS12 --ks-key-alias "$alias_name" \
            --ks-pass env:EP_QA_STORE_PASSWORD --key-pass env:EP_QA_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out evidence/EP_Voice_Diagnostic_No_Accessibility.apk "$RUNNER_TEMP/diagnostic-aligned.apk"
          "$tools/apksigner" verify --verbose --Werr evidence/EP_Voice_Diagnostic_No_Accessibility.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print evidence/EP_Voice_Diagnostic_No_Accessibility.apk > evidence/diagnostic-manifest.xml
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|ChatGptVoiceAccessibilityService|android.accessibilityservice' evidence/diagnostic-manifest.xml; then
            echo "::error::Accessibility remains in diagnostic manifest"
            exit 1
          fi
          grep -F 'de.europlast.epvoice.diagnostic' evidence/diagnostic-manifest.xml
          sha256sum evidence/EP_Voice_Diagnostic_No_Accessibility.apk > evidence/diagnostic-sha256.txt
      - name: Diagnose-APK und Manifest bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ep-voice-diagnostic-no-accessibility
          path: |
            evidence/EP_Voice_Diagnostic_No_Accessibility.apk
            evidence/diagnostic-manifest.xml
            evidence/diagnostic-sha256.txt
          if-no-files-found: error
