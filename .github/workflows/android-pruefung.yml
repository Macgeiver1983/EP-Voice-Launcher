name: EP Voice – Modellprüfung und Android-Build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ep-voice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android-Build und Lint
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug 2>&1 | tee ci-build.log
      - name: APK und Buildprotokoll bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep-voice-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            ci-build.log
          if-no-files-found: warn
  modelle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Modelle herunterladen und ONNX-Struktur prüfen
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check onnx==1.17.0
          python scripts/download_and_verify_models.py 2>&1 | tee ci-model-download.log
      - name: Modellprotokolle bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep-voice-modelle
          path: |
            ci-model-report.txt
            ci-model-download.log
          if-no-files-found: warn
