name: EP Voice – Modellbeschaffung und Android-Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Modelle herunterladen und ONNX-Struktur prüfen
        run: |
          python -m pip install --disable-pip-version-check onnx
          python scripts/download_and_verify_models.py
      - name: Android-Build und Lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: APK und Prüfprotokoll bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep-voice-ci-ergebnis
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            ci-model-report.txt
          if-no-files-found: warn
