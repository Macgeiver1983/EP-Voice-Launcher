name: EP Voice V0.4.7 minimal Accessibility test
on:
  push:
    branches:
      - dev/v0.4.7-accessibility-minimal-test
    paths:
      - '.github/workflows/minimal-accessibility-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build, lint, model check, signature verification
        run: |
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          python3 scripts/download_and_verify_models.py --apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/EP_Voice_V047_Minimal_Accessibility_Test.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Publish diagnostic APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.7-minimal-accessibility-test release/*.apk release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "EP Voice V0.4.7 minimal Accessibility diagnostic" \
            --notes "Diagnostic debug-signed APK; separate .v047test application ID. Accessibility remains enabled with reduced event subscriptions. Play Protect must remain enabled; device installation and security approval are not guaranteed. Does not replace V0.4.6." \
            --prerelease
